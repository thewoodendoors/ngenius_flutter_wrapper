name: ngenius_flutter_wrapper
description: "Card, Apple Pay and Google Pay payments through the official N-Genius Online (Network International) native SDKs."
version: 0.1.0

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.thewoodendoors.ngenius_flutter_wrapper
        pluginClass: NgeniusFlutterWrapperPlugin
      ios:
        pluginClass: NgeniusFlutterWrapperPlugin
